name: Build APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'android-res/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Wrap the web page in an Android app (Capacitor)
        run: |
          mkdir -p app/www && cp index.html app/www/
          cd app
          npm init -y >/dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Maintenance Relay" com.emeraldlanguagelearning.maintenancerelay --web-dir www
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r ../android-res/* android/app/src/main/res/
      - name: Build
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../MaintenanceRelay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaintenanceRelay-apk
          path: MaintenanceRelay.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MaintenanceRelay.apk --title "Maintenance Relay APK" --notes "Built from ${GITHUB_SHA::7}. Download MaintenanceRelay.apk on the Android tablet and install it."
